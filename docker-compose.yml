# ===========================================
# CRM-Bank Production Docker Compose
# Domain: csone.cropsciences.co.th
# ===========================================

services:
  # ===========================================
  # PostgreSQL Database
  # ===========================================
  postgres:
    image: postgres:16-alpine
    container_name: crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password is required}
      POSTGRES_DB: ${POSTGRES_DB:-crm_bank}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - crm-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-crm_admin} -d ${POSTGRES_DB:-crm_bank}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Security: ไม่ expose port สู่ภายนอก เชื่อมต่อผ่าน internal network เท่านั้น
    ports:
      - "127.0.0.1:5432:5432"

  # ===========================================
  # Next.js Application
  # ===========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-crm_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-crm_bank}
      AUTH_SECRET: ${AUTH_SECRET:?Auth secret is required}
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://csone.cropsciences.co.th}
      NEXT_PUBLIC_SHOW_RANDOM_FILL: "false"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - crm-network
    # Internal port only - Nginx จะ proxy มาที่นี่
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===========================================
  # Nginx Reverse Proxy
  # ===========================================
  nginx:
    image: nginx:alpine
    container_name: crm-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
      - certbot_data:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - crm-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================
  # Certbot for SSL (Let's Encrypt)
  # ===========================================
  certbot:
    image: certbot/certbot:latest
    container_name: crm-certbot
    volumes:
      - certbot_data:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    depends_on:
      - nginx
    # รัน renewal ทุก 12 ชั่วโมง
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  # ===========================================
  # Database Migration (One-time job)
  # ===========================================
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    container_name: crm-migrate
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-crm_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-crm_bank}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - crm-network
    # รัน db push เพื่อความสะดวก (หรือเปลี่ยนเป็น migrate deploy หากต้องการใช้ migration files)
    command: pnpm exec prisma db push --accept-data-loss
    restart: "no"
    profiles:
      - migrate

  # ===========================================
  # Database Seed (One-time job)
  # ===========================================
  seed:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    container_name: crm-seed
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-crm_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-crm_bank}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - crm-network
    # รัน prisma generate ก่อน แล้วค่อยรัน seed
    command: sh -c "pnpm exec prisma generate && node prisma/seed.js"
    restart: "no"
    profiles:
      - seed

# ===========================================
# Networks
# ===========================================
networks:
  crm-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ===========================================
# Volumes
# ===========================================
volumes:
  postgres_data:
    driver: local
  certbot_data:
    driver: local
  certbot_certs:
    driver: local
