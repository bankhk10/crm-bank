version: "3.8"

services:
  # PostgreSQL Database for local testing
  postgres:
    image: postgres:16-alpine
    container_name: crm-bank-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crm_bank
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - crm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm-bank-app-local
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/crm_bank
      - AUTH_TRUST_HOST=true
      - NEXT_PUBLIC_SHOW_RANDOM_FILL=true
    env_file:
      - .env.local
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - crm-network
    command: >
      sh -c "
        echo 'Running database migrations...' &&
        npx prisma migrate deploy &&
        echo 'Starting application...' &&
        node server.js
      "

networks:
  crm-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
