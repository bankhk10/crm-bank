# ===========================================
# CRM-Bank Application Stack
# Domain: csone.cropsciences.co.th
# ===========================================
# Requires: Database stack running first (crm-postgres healthy)
# Deploy: docker compose -f docker-compose.app.yml up -d

services:
  # ===========================================
  # Next.js Application
  # ===========================================
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: crm-app:latest
    container_name: crm-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # ใช้ container_name "crm-postgres" แทน service name เพราะ db อยู่คนละ compose
      DATABASE_URL: postgresql://${POSTGRES_USER:-crm_admin}:${POSTGRES_PASSWORD}@crm-postgres:5432/${POSTGRES_DB:-crm}
      AUTH_SECRET: ${AUTH_SECRET:?Auth secret is required}
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://csone.cropsciences.co.th}
      NEXT_PUBLIC_SHOW_RANDOM_FILL: "false"
    networks:
      - crm-network
    user: root
    volumes:
      - ../../public/uploads:/app/public/uploads
    # Internal port only - Nginx จะ proxy มาที่นี่
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===========================================
  # Nginx Reverse Proxy
  # ===========================================
  nginx:
    image: nginx:alpine
    container_name: crm-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../nginx/conf.d:/etc/nginx/conf.d:ro
      - ../../nginx/ssl:/etc/nginx/ssl:ro
      - ../../nginx/logs:/var/log/nginx
      - certbot_data:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - crm-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================
  # Certbot for SSL (Let's Encrypt)
  # ===========================================
  certbot:
    image: certbot/certbot:latest
    container_name: crm-certbot
    volumes:
      - certbot_data:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    depends_on:
      - nginx
    networks:
      - crm-network
    # รัน renewal ทุก 12 ชั่วโมง
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  # ===========================================
  # Database Migration (One-time job)
  # Profile: migrate
  # ===========================================
  migrate:
    build:
      context: ../..
      dockerfile: Dockerfile.migrate
    image: crm-migrate:latest
    container_name: crm-migrate
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-crm_admin}:${POSTGRES_PASSWORD}@crm-postgres:5432/${POSTGRES_DB:-crm}
    networks:
      - crm-network
    # wait-for-db: รอจนกว่า postgres จะ ready แล้วค่อย migrate
    # ใช้ prisma migrate deploy สำหรับ production (มี migration files)
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        until pg_isready -h crm-postgres -p 5432 -U ${POSTGRES_USER:-crm_admin}; do
          echo 'Database not ready, retrying in 2s...'
          sleep 2
        done &&
        echo 'Database is ready!' &&
        pnpm exec prisma migrate deploy
      "
    restart: "no"
    profiles:
      - migrate

  # ===========================================
  # Database Push (One-time job) - ใช้กรณีไม่มี migration files
  # Profile: db-push
  # WARNING: --accept-data-loss อาจลบข้อมูลได้!
  # ===========================================
  db-push:
    build:
      context: ../..
      dockerfile: Dockerfile.migrate
    image: crm-migrate:latest
    container_name: crm-db-push
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-crm_admin}:${POSTGRES_PASSWORD}@crm-postgres:5432/${POSTGRES_DB:-crm}
    networks:
      - crm-network
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        until pg_isready -h crm-postgres -p 5432 -U ${POSTGRES_USER:-crm_admin}; do
          echo 'Database not ready, retrying in 2s...'
          sleep 2
        done &&
        echo 'Database is ready!' &&
        echo 'WARNING: db push with --accept-data-loss may destroy data!' &&
        pnpm exec prisma db push --accept-data-loss
      "
    restart: "no"
    profiles:
      - db-push

  # ===========================================
  # Database Seed (One-time job)
  # Profile: seed
  # ===========================================
  seed:
    build:
      context: ../..
      dockerfile: Dockerfile.migrate
    image: crm-seed:latest
    container_name: crm-seed
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-crm_admin}:${POSTGRES_PASSWORD}@crm-postgres:5432/${POSTGRES_DB:-crm}
    networks:
      - crm-network
    # wait-for-db + prisma generate + run seed
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        until pg_isready -h crm-postgres -p 5432 -U ${POSTGRES_USER:-crm_admin}; do
          echo 'Database not ready, retrying in 2s...'
          sleep 2
        done &&
        echo 'Database is ready!' &&
        pnpm exec prisma generate &&
        node prisma/seed.js
      "
    restart: "no"
    profiles:
      - seed

# ===========================================
# Networks (External - shared with db stack)
# ===========================================
networks:
  crm-network:
    name: crm-network
    external: true

# ===========================================
# Volumes
# ===========================================
volumes:
  certbot_data:
    driver: local
  certbot_certs:
    driver: local
