# ===========================================
# CRM-Bank Server Configuration
# Domain: csone.cropsciences.co.th
# ===========================================

# ===========================================
# Upstream Configuration
# ===========================================
upstream nextjs_app {
    server app:3000;
    keepalive 32;
}

# ===========================================
# HTTP - Redirect to HTTPS
# ===========================================
server {
    listen 80;
    listen [::]:80;
    server_name csone.cropsciences.co.th www.csone.cropsciences.co.th;

    # Let's Encrypt verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# ===========================================
# HTTPS - Main Server
# ===========================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name csone.cropsciences.co.th www.csone.cropsciences.co.th;

    # ===========================================
    # SSL Configuration
    # ===========================================
    ssl_certificate /etc/letsencrypt/live/csone.cropsciences.co.th/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/csone.cropsciences.co.th/privkey.pem;

    # SSL Settings (Modern configuration)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # SSL Session
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ===========================================
    # Security Headers
    # ===========================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self'; frame-ancestors 'self';" always;

    # ===========================================
    # Global Proxy Settings (ขยาย Buffer ชุดใหญ่)
    # ===========================================
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;

    # ขยาย Buffer เพื่อรองรับ Cookie ขนาดใหญ่มาก (RBAC)
    proxy_buffer_size 512k;
    proxy_buffers 8 512k;
    proxy_busy_buffers_size 512k;
    proxy_temp_file_write_size 512k;
    proxy_max_temp_file_size 0;

    proxy_connect_timeout 120s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # ===========================================
    # Logging
    # ===========================================
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # ===========================================
    # Locations
    # ===========================================
    
    # Static files
    location /_next/static {
        proxy_pass http://nextjs_app;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API Auth (Login)
    location /api/auth {
        limit_req zone=login_limit burst=30 nodelay;
        limit_conn conn_limit 15;
        proxy_pass http://nextjs_app;
    }

    # Regular API
    location /api {
        proxy_pass http://nextjs_app;
    }

    # Main Application
    location / {
        proxy_pass http://nextjs_app;
    }

    # Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    location /uploads/ {
        alias /usr/share/nginx/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }
}
